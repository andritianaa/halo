[workspace]
resolver = "3"
members = [
    "crates/halo-ui",
    "crates/halo-core",
    "crates/halo-platform",
    "crates/halo-modules",
    "crates/halo-capture",
    "crates/halo-secure",
    "crates/halo-app",
]
default-members = ["crates/halo-app"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
repository = "https://github.com/andritianaa/halo"

[workspace.dependencies]
halo-ui = { path = "crates/halo-ui", default-features = false }
halo-core = { path = "crates/halo-core" }
halo-platform = { path = "crates/halo-platform" }
halo-modules = { path = "crates/halo-modules" }
halo-capture = { path = "crates/halo-capture" }
halo-secure = { path = "crates/halo-secure" }

# UI — gpui-kit re-exports GPUI (gpui-pre =0.3.12), components, theme, Lucide icons.
gpui-kit = "0.10.0"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
anyhow = "1"
log = "0.4"
env_logger = "0.11"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "unstable-locales"] }
raw-window-handle = "0.6"
tray-icon = "0.21"
global-hotkey = "0.7"
windows = { version = "0.61", features = [
    "Foundation",
    "Networking_Connectivity",
    "Web_Http",
    "Web_Http_Headers",
    "Media_Control",
    "UI_Notifications",
    "UI_Notifications_Management",
    "Foundation_Collections",
    "ApplicationModel",
    "Storage",
    "Storage_Streams",
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Dwm",
    "Win32_System_Registry",
    "Win32_UI_HiDpi",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Accessibility",
    "Win32_UI_Shell",
    "Win32_System_Power",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
    "Win32_System_Wmi",
    "Win32_System_Rpc",
    "Devices_Radios",
    "Win32_System_Threading",
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    "Win32_System_Performance",
    "Win32_System_Memory",
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
    "Win32_Media_MediaFoundation",
    "Win32_NetworkManagement_WiFi",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_Networking_WinSock",
    "Win32_Devices_Bluetooth",
    "Win32_Security",
    "Win32_Security_Cryptography",
    "Win32_System_ProcessStatus",
    "Win32_System_SystemInformation",
    "Win32_System_Ole",
    "Win32_System_SystemServices",
    "Win32_Storage_FileSystem",
] }

# Keep debug builds small: no debug info for dependencies, line tables for ours.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# GPUI precompiles its HLSL shaders with fxc.exe (Windows SDK) unless debug assertions are on,
# in which case it compiles them at startup with d3dcompiler_47.dll (part of Windows).
# Enable assertions only for that crate and build scripts so the SDK tool isn't needed.
[profile.release.package.gpui-pre-windows]
debug-assertions = true

[profile.release.build-override]
debug-assertions = true
