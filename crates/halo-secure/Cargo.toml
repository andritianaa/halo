[package]
name = "halo-secure"
description = "Halo security modules: encrypted vault (M10), per-process network monitor/limiter (M5)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
halo-core = { workspace = true }
halo-platform = { workspace = true }
anyhow = { workspace = true }
log = { workspace = true }
argon2 = { version = "0.6.0", default-features = false, features = ["alloc", "zeroize"] }
chacha20poly1305 = { version = "0.11.0", features = ["zeroize"] }
getrandom = "0.4.3"
zeroize = "1.9.2"
base64 = "0.23.1"
libloading = "0.9.1"
serde_json.workspace = true
chrono = { workspace = true }
serde = { workspace = true, features = ["derive"] }

[target.'cfg(windows)'.dependencies]
windows = { workspace = true }
